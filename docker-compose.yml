# ローカル開発用の一括起動。本番は infra/cloudrun/ のスクリプトで Cloud Run にデプロイする。
services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

